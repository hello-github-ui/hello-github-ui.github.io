  <script>
    (function () {
      "use strict";
      var PAYLOAD = JSON.parse(document.getElementById("enc-payload").textContent);
      var PERMALINK = "/posts/encrypted-demo/";
      var input = document.getElementById("enc-password");
      var btn = document.getElementById("enc-unlock");
      var err = document.getElementById("enc-error");
      var enc = new TextEncoder();
      var dec = new TextDecoder();

      function b64ToBuf(b64) {
        var bin = atob(b64);
        var u8 = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        return u8;
      }

      function deriveKey(pwd, salt) {
        return crypto.subtle.importKey("raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"])
          .then(function (km) {
            return crypto.subtle.deriveKey(
              { name: "PBKDF2", salt: salt, iterations: PAYLOAD.iter, hash: "SHA-256" },
              km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          });
      }

      function decryptHtml(pwd) {
        var salt = b64ToBuf(PAYLOAD.salt);
        var iv = b64ToBuf(PAYLOAD.iv);
        var ct = b64ToBuf(PAYLOAD.ct);
        var aad = PAYLOAD.aad ? b64ToBuf(PAYLOAD.aad) : undefined;
        return deriveKey(pwd, salt).then(function (key) {
          return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv, additionalData: aad }, key, ct);
        }).then(function (plain) {
          return dec.decode(plain);
        });
      }

      function render(html) {
        // 在解密后的明文页末尾注入 bfcache 防护脚本，
        // 确保前进/后退后从缓存恢复时强制重载回到锁屏。
        // 双保险：锁屏页有 pageshow 监听器，明文页也注入一道。
        var guard = '<script>' +
          '(function(){' +
          'window.addEventListener("pageshow",function(e){' +
          'if(e.persisted){location.reload();}' +
          '});' +
          '})();' +
          '<\/script>';
        document.open();
        document.write(html + guard);
        document.close();
      }

      function unlock() {
        var pwd = input.value;
        if (!pwd) return;
        btn.disabled = true;
        err.classList.remove("show");
        decryptHtml(pwd).then(function (html) {
          render(html);
        }).catch(function () {
          btn.disabled = false;
          input.value = "";
          input.focus();
          err.classList.add("show");
        });
      }

      btn.addEventListener("click", unlock);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") unlock();
      });

      // 刷新或前进/后退后必须重新输入密码：
      // 1) 普通刷新会重新加载壳页面，天然回到锁屏（本页面不缓存明文，无 sessionStorage 缓存）；
      // 2) 前进/后退若命中浏览器 bfcache（页面状态被完整恢复），通过 pageshow 检测并强制重新加载，
      //    回到壳页面锁屏。注意监听器注册在 window 上，document.write 不会移除它。
      window.addEventListener("pageshow", function (e) {
        if (e.persisted) {
          location.reload();
        }
      });
    })();
  </script>
