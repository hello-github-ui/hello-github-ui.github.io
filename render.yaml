services:
  - type: web
    name: hello-github-ui-github-io
    runtime: static
    plan: free

    branch: main
    autoDeployTrigger: commit

    buildCommand: bash render-build.sh
    staticPublishPath: ./public

    envVars:
      - key: HUGO_VERSION
        value: "0.165.0"

      - key: DART_SASS_VERSION
        value: "1.102.0"

      - key: HUGO_BASEURL
        value: "https://hello-github-ui-github-io.onrender.com/"

      - key: TZ
        value: "Asia/Shanghai"
